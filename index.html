<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3A2D">
<meta name="color-scheme" content="dark">
<title>المدرّبة لارا · نسخة تجريبية</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2D9A8"/><stop offset="1" stop-color="#B58A45"/></linearGradient></defs>
  <symbol id="mark" viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" rx="11" fill="url(#mg)"/><path d="M12 25c0-4 3-7 7-7s7 3 7 7-3 4-7 4h-7m14-4h4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="room" aria-hidden="true"></div>
<div id="stage" aria-hidden="true"><div class="laptop" id="laptop">
  <div class="lid">
    <div class="lid-front"><div class="screen" id="screen"><div class="boot"><svg class="mark" viewBox="0 0 40 40"><use href="#mark"/></svg><small>المدرّبة لارا</small></div></div></div>
    <div class="lid-back" id="lidBack"><svg class="mark" viewBox="0 0 40 40"><use href="#mark"/></svg></div>
  </div>
  <div class="deck"><div class="keys"></div><div class="pad"></div></div>
  <div class="phone" id="phone"><div class="ph-body"><div class="ph-screen" id="phScreen"></div></div></div>
</div></div>
<!-- Keyboard/screen-reader handles for the 3D scene -->
<button class="sr" id="phoneBtn" type="button">الموبايل: افتحي رمز QR لتكملي من موبايلك</button>
<button class="hint" id="hint" type="button" hidden>المسي اللابتوب لتفتحيه</button>

<div class="qrm" id="qrm" hidden role="dialog" aria-modal="true" aria-labelledby="qrTitle"><div class="qrc">
  <b id="qrTitle">كمّلي من موبايلك</b><div class="code" id="qrBox"></div>
  <span class="url" id="qrUrl"></span>
  <p>امسحي الرمز بكاميرا موبايلك، فتنفتح المنصّة هناك.</p>
  <button class="btn" id="qrClose" type="button">تمام</button>
</div></div>

<div id="os" aria-live="off">
  <header class="bar">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><use href="#mark"/></svg><b class="name">المدرّبة لارا</b>
    <span class="clock" id="clock"></span><span class="who" id="who"></span>
    <button class="btn" id="lidBtn" type="button" aria-label="سكّري اللابتوب"></button>
    <button class="btn" id="zoomBtn" type="button"></button>
  </header>
  <div class="lock" id="lock">
    <svg class="av" viewBox="0 0 40 40" aria-hidden="true"><use href="#mark"/></svg>
    <div class="big" id="lockTime"></div><div class="date" id="lockDate"></div>
    <form id="loginForm" novalidate>
      <label class="sr" for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="username" inputmode="email" placeholder="البريد الإلكتروني" value="demo@coach.lara" required>
      <label class="sr" for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" value="demo1234" required>
      <button class="go" type="submit" id="loginBtn">ادخلي</button>
      <p class="err" id="loginErr" role="alert"></p>
    </form>
    <div id="unlock" hidden>
      <p class="hello" id="hello"></p>
      <form id="unlockForm"><button class="go" type="submit">افتحي</button></form>
      <button class="link" id="logoutBtn" type="button">لستِ أنتِ؟ سجّلي الخروج</button>
    </div>
  </div>
  <div class="main">
    <nav class="side" id="side" aria-label="الدورات"></nav>
    <section class="content" id="content" aria-live="polite"></section>
    <div class="win" id="win" role="dialog" aria-modal="true" aria-labelledby="lessonTitle"><div class="panel" id="panel"></div></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
</div>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>

<script src="vendor/qrcode.min.js" defer></script>
<script src="courses.js" defer></script>
<script src="demo-api.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
