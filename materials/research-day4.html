/* ===== من الفكرة إلى التطبيق · اليوم الأول (React) ===== */
:root{--g:#174C3C;--g2:#0F3A2D;--g3:#1F5C49;--b:#F2E8D8;--i:#FFFCF6;--t:#203B2E;--a:#B58A45;--a2:#7A5A22;--gold:#E8C48A;
 --line:#DCCDB3;--line2:#C9B795;--tint:#E7EEE6;--ok:#1F6B4C;--bad:#9A3324;--chrome:#E7DCC8;--sh:0 .3cqw 1.1cqw rgba(32,59,46,.08);
 --font:'Tajawal','Segoe UI',Tahoma,sans-serif}
html[data-font="majalla"]{--font:'Sakkal Majalla','Tajawal','Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:var(--font);color:var(--t);background:var(--chrome);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
bdi,.ltr{unicode-bidi:isolate}.ltr{direction:ltr;display:inline-block}
.mono{font-family:Consolas,'Courier New',monospace;direction:ltr;unicode-bidi:isolate}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.bar{display:flex;align-items:center;gap:.7rem;padding:.45rem 1rem;background:var(--g);color:var(--i)}
.bar .brand{font-weight:800;white-space:nowrap;display:flex;gap:.5rem;align-items:center}.bar .brand i{font-style:normal;color:var(--a)}.bar .brand small{color:#E9DFC9;font-weight:500}
.bar .prog{flex:1;height:.35rem;background:#2E6352;border-radius:1rem;overflow:hidden;min-width:3rem}
.bar .prog b{display:block;height:100%;background:var(--a);border-radius:1rem}
.bar .num{font-weight:800;direction:ltr;white-space:nowrap}
.tb{display:inline-flex;align-items:center;gap:.35rem;border:1px solid #4F7F6E;background:transparent;color:var(--i);border-radius:.5rem;padding:.25rem .7rem;font-weight:700;font-size:.88rem;white-space:nowrap}
.tb:hover,.tb.on{background:#245E4B;border-color:var(--a)}
.wrap{display:grid;place-items:center;padding:1rem;min-height:0;overflow:hidden}
.stage{width:min(100%,calc((100vh - 7.2rem)*16/9));aspect-ratio:16/9;position:relative;container-type:inline-size;border-radius:10px;overflow:hidden;box-shadow:0 14px 40px rgba(32,59,46,.2);background:var(--b)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.4rem 1rem}
.foot .sec{font-weight:800;color:var(--g);flex:1;text-align:center}
.nb{border:2px solid var(--g);background:var(--g);color:var(--i);border-radius:.55rem;padding:.25rem 1rem;font-weight:800}
.nb.gh{background:var(--i);color:var(--g)}.nb:disabled{background:var(--chrome);border-color:var(--line2);color:#6B6250;cursor:not-allowed}
html.pres .bar,html.pres .foot{display:none}html.pres .wrap{padding:0;background:#13291F}html.pres .stage{width:min(100vw,calc(100vh*16/9));border-radius:0}

/* ===== الشريحة ===== */
.slide{position:absolute;inset:0;background:var(--b);font-size:1.7cqw;line-height:1.6;overflow:hidden}
.slide.light::before{content:"";position:absolute;inset:auto auto -12cqw -12cqw;width:30cqw;height:30cqw;border-radius:50%;background:radial-gradient(circle,rgba(23,76,60,.07),transparent 70%);pointer-events:none}
.sl{position:absolute;inset:0;padding:3cqw 7.2cqw 4.4cqw 4.8cqw;display:flex;flex-direction:column;gap:.9cqw}
.kick{display:flex;align-items:center;gap:1cqw;font-size:1.22cqw;font-weight:800;color:var(--a2)}
.role{display:inline-flex;align-items:center;gap:.5cqw;font-size:1.1cqw;font-weight:900;border-radius:3cqw;padding:.15cqw 1.05cqw;border:.13cqw solid var(--g);line-height:1.6;background:var(--g);color:var(--i)}
.role.r-ex,.role.r-proj{background:var(--i);color:var(--g)}
.role.r-lab{background:var(--a);border-color:var(--a);color:#1E1608}
.role.r-what,.role.r-fix,.role.r-review{background:var(--i);color:var(--g);border-style:dashed}
.role.r-proj{border-color:var(--a);color:var(--a2)}
.sl h2{font-size:2.95cqw;font-weight:900;color:var(--g);line-height:1.25;position:relative;padding-bottom:.7cqw}
.sl h2::after{content:"";position:absolute;right:0;bottom:0;width:5cqw;height:.32cqw;border-radius:1cqw;background:var(--a)}
.sl h2 em{font-style:normal;color:var(--a2)}
.lead{font-size:1.8cqw;color:#2B4537;max-width:80cqw}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:1.2cqw}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw;align-items:center;flex:1;min-height:0}
.cols.w{grid-template-columns:1.15fr .85fr}
.col{display:flex;flex-direction:column;gap:1.1cqw;min-width:0}
.rail{position:absolute;right:3cqw;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:.9cqw}
.rail::before{content:"";position:absolute;top:0;bottom:0;width:.14cqw;background:var(--line2)}
.rail i{position:relative;width:.95cqw;height:.95cqw;border-radius:1cqw;background:var(--b);border:.16cqw solid var(--line2)}
.rail i.past{background:var(--line2)}.rail i.on{height:3.2cqw;background:var(--a);border-color:var(--a)}
.foot2{position:absolute;bottom:1.3cqw;left:4.8cqw;right:7.2cqw;display:flex;justify-content:space-between;font-size:1.02cqw;font-weight:700;color:#5C5240;border-top:.1cqw solid var(--line);padding-top:.6cqw}
.foot2 .n{direction:ltr;color:var(--g)}
.note{font-size:1.35cqw;border-right:.3cqw solid var(--a);padding-right:1.1cqw}
.src{font-size:1.1cqw;color:#4F4636;border-right:.25cqw solid var(--line2);padding-right:1cqw}
.tag{display:inline-block;font-size:1cqw;font-weight:800;border-radius:.4cqw;padding:0 .7cqw;border:.12cqw solid;vertical-align:middle;margin-inline-start:.6cqw;line-height:1.7;background:var(--i)}
.tag.ill{color:var(--bad);border-color:var(--bad)}.tag.rep{color:var(--g);border-color:var(--g)}
.card{background:var(--i);border:.12cqw solid #E4D7C0;border-radius:1cqw;padding:1.2cqw 1.5cqw;box-shadow:var(--sh)}
.card h4{font-size:1.6cqw;color:var(--g);font-weight:900;line-height:1.3}
.card p{font-size:1.4cqw;line-height:1.5}
.def{border-right:.5cqw solid var(--g);padding:.2cqw 1.6cqw .3cqw 0}
.def b{display:block;font-weight:900;color:var(--g);font-size:1.95cqw;line-height:1.3}.def p{font-size:1.65cqw}
.pill{display:inline-flex;align-items:center;gap:.5cqw;border:.15cqw solid var(--g);border-radius:3cqw;padding:.3cqw 1.2cqw;font-size:1.3cqw;font-weight:800;background:var(--i);color:var(--g)}
.pill.on{background:var(--g);color:var(--i)}.pill.gold{background:var(--a);border-color:var(--a);color:#1E1608}
.btn{border:.15cqw solid var(--g);background:var(--g);color:var(--i);border-radius:.6cqw;padding:.4cqw 1.4cqw;font-weight:800;font-size:1.35cqw}
.btn.gh{background:var(--i);color:var(--g)}.btn:disabled{background:var(--b);border-color:var(--line2);color:#7A705C;cursor:not-allowed}
.row{display:flex;gap:.8cqw;align-items:center;flex-wrap:wrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.hint{font-size:1.15cqw;font-weight:800;color:#5C5240}

/* ===== الغلاف ===== */
.cover{position:absolute;inset:0;display:grid;grid-template-columns:50% 50%;background:radial-gradient(70cqw 50cqw at 25% 55%,#1E5A47 0%,var(--g) 55%,#123F31 100%);color:var(--i);overflow:hidden}
.cover .ct{padding:4.6cqw 5.2cqw 3.6cqw 2cqw;display:flex;flex-direction:column;justify-content:space-between;gap:1.6cqw;position:relative;z-index:2}
.cover .bdg{align-self:flex-start;font-weight:800;font-size:1.45cqw;color:#1E1608;background:var(--a);border-radius:3cqw;padding:.2cqw 1.4cqw}
.cover h1{font-size:4.6cqw;line-height:1.22;font-weight:900}.cover h1 em{font-style:normal;color:var(--gold)}
.cover .rl{width:7cqw;height:.45cqw;background:var(--a);border-radius:1cqw;margin:1.8cqw 0 1.6cqw}
.cover .q{font-size:1.9cqw;color:#F1E7D5;line-height:1.6;max-width:40cqw}
.cover .mt{display:flex;gap:1cqw;flex-wrap:wrap;font-size:1.35cqw;font-weight:800}
.cover .mt span{border:.13cqw solid rgba(255,252,246,.35);border-radius:.7cqw;padding:.35cqw 1.1cqw}
.cover .pg{font-size:1.2cqw;color:#D9CDB3;max-width:40cqw;line-height:1.5}
.cover .art{position:relative;display:grid;place-items:center;padding:2cqw}
.cover svg{width:100%;height:auto;max-height:46cqw;overflow:visible}
.glow{position:absolute;left:50%;top:50%;width:26cqw;height:26cqw;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(232,196,138,.38),rgba(232,196,138,.08) 45%,transparent 70%);filter:blur(.6cqw);animation:glow 3.4s ease-in-out infinite;pointer-events:none}
@keyframes glow{50%{opacity:.55;transform:translate(-50%,-50%) scale(1.12)}}
.cv .wire{fill:none;stroke:rgba(255,252,246,.16);stroke-width:2}
.cv .flow{fill:none;stroke:#C9A066;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:6 16;animation:dash 2.6s linear infinite}
.cv .flow.g{stroke:var(--gold)}
@keyframes dash{to{stroke-dashoffset:-88}}
.cv .halo{fill:none;stroke:var(--gold);stroke-width:2;transform-origin:310px 280px;animation:halo 3.2s ease-out infinite}
.cv .halo.h2{animation-delay:1.6s}
@keyframes halo{from{transform:scale(.75);opacity:.6}to{transform:scale(1.6);opacity:0}}
.cv .core{fill:#1F5C49;stroke:#C9A066;stroke-width:2.6}
.cv .node{fill:#1F5C49;stroke:rgba(255,252,246,.45);stroke-width:1.6}
.cv .node.hot{fill:#C9A066;stroke:var(--gold)}
.cv .gi{fill:none;stroke:var(--i);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cv .gi.dk{stroke:#1E1608}.cv .gi.au{stroke:var(--gold)}
.cv text{font-family:var(--font);font-weight:800;fill:var(--i);font-size:18px;text-anchor:middle}
.cv text.m{fill:#E6D9BF;font-size:15px;font-weight:700}
.cv .bob{animation:bob 4s ease-in-out infinite}.cv .bob.b2{animation-delay:1s}.cv .bob.b3{animation-delay:2s}.cv .bob.b4{animation-delay:3s}
@keyframes bob{50%{transform:translateY(-7px)}}

/* ===== الفاصل ===== */
.divider{position:absolute;inset:0;background:radial-gradient(60cqw 50cqw at 20% 50%,#1E5A47,var(--g) 60%,#123F31);color:var(--i);display:flex;flex-direction:column;justify-content:center;gap:3.6cqw;padding:0 9cqw 0 8cqw;overflow:hidden}
.divider .rings{position:absolute;left:-12cqw;top:50%;width:50cqw;height:50cqw;margin-top:-25cqw;animation:spin 60s linear infinite}
.divider .rings circle{fill:none;stroke:rgba(255,252,246,.08);stroke-width:1.5;stroke-dasharray:4 10}
@keyframes spin{to{transform:rotate(360deg)}}
.dvm{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4cqw;position:relative}
.dn{width:16cqw;height:auto;overflow:visible}
.dn text{font-family:var(--font);font-weight:900;font-size:120px;fill:none;stroke:var(--a);stroke-width:2.5;direction:ltr}
.divider h2{font-size:4.6cqw;font-weight:900;line-height:1.2}.divider p{font-size:2.1cqw;color:#EBD7B0;margin-top:1cqw}
.dmap{list-style:none;display:flex;flex-wrap:wrap;gap:.8cqw;border-top:.13cqw solid rgba(255,252,246,.25);padding-top:1.8cqw;position:relative}
.dmap li{font-size:1.25cqw;font-weight:800;border:.13cqw solid rgba(255,252,246,.35);border-radius:3cqw;padding:.2cqw 1.1cqw;display:flex;gap:.6cqw}
.dmap li span{color:var(--gold);direction:ltr}.dmap li.past{border-style:dashed}.dmap li.past::after{content:"✓";color:var(--gold)}
.dmap li.on{background:var(--a);border-color:var(--a);color:#1E1608}.dmap li.on span{color:#1E1608}

/* ===== محاكاة المحادثة ===== */
.chat{background:var(--i);border:.12cqw solid var(--line);border-radius:1.1cqw;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.chat .hd{display:flex;justify-content:space-between;align-items:center;padding:.6cqw 1.2cqw;font-weight:900;font-size:1.4cqw;color:var(--g);border-bottom:.12cqw solid var(--line)}
.chat .hd.dk{background:var(--g);color:var(--i)}
.chat .bd{padding:1cqw 1.2cqw;display:flex;flex-direction:column;gap:.8cqw;min-height:20cqw}
.msg{max-width:88%;border-radius:1cqw;padding:.6cqw 1cqw;font-size:1.3cqw;line-height:1.55}
.msg.me{align-self:flex-start;background:var(--tint);border:.12cqw solid #CFDCCF}
.msg.ai{align-self:flex-end;background:#FBF6EC;border:.12cqw solid var(--line)}
.flag{display:inline-block;background:#F8E2DC;color:var(--bad);border-radius:.4cqw;padding:0 .5cqw;font-weight:800}
.good{display:inline-block;background:#DDEBE1;color:var(--ok);border-radius:.4cqw;padding:0 .5cqw;font-weight:800}

/* ===== أشرطة التوقّع ===== */
.pbar{display:grid;grid-template-columns:11cqw 1fr 5cqw;gap:1cqw;align-items:center;font-size:1.4cqw;font-weight:700}
.pbar .tr{height:2.4cqw;background:var(--i);border:.12cqw solid var(--line);border-radius:.6cqw;overflow:hidden}
.pbar .fl{height:100%;background:var(--g);border-radius:.5cqw}
.pbar .fl.alt{background:repeating-linear-gradient(135deg,#EFE3CC 0 .7cqw,#E4D4B6 .7cqw 1.4cqw)}
.pbar .v{direction:ltr;text-align:left;color:var(--g);font-weight:900}
.sw{display:inline-flex;align-items:center;gap:.8cqw;font-size:1.35cqw;font-weight:800;background:none;border:0;color:var(--g)}
.sw .kn{width:4.4cqw;height:2.3cqw;border-radius:2cqw;background:var(--line2);position:relative;display:inline-block}
.sw .kn i{position:absolute;top:.25cqw;width:1.8cqw;height:1.8cqw;border-radius:50%;background:var(--i);box-shadow:0 .1cqw .3cqw rgba(0,0,0,.2)}
.sw.on .kn{background:var(--g)}

/* ===== البطاقات المقلوبة ===== */
.flip{perspective:120cqw;cursor:pointer;border:0;background:none;text-align:right;height:100%}
.flip .in{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.flip .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.1cqw;padding:1.6cqw;display:flex;flex-direction:column;gap:.8cqw;box-shadow:var(--sh)}
.flip .fr{background:var(--i);border:.12cqw solid #E4D7C0}
.flip .bk{background:var(--g);color:var(--i);transform:rotateY(180deg)}
.flip .ic{font-size:3.4cqw;line-height:1}
.flip h4{font-size:1.9cqw;font-weight:900;color:var(--g)}.flip .bk h4{color:var(--gold)}
.flip p{font-size:1.4cqw;line-height:1.55}
.flip .tap{margin-top:auto;font-size:1.1cqw;font-weight:800;color:#5C5240}.flip .bk .tap{color:#D9CDB3}

/* ===== باني التعليمات ===== */
.part{color:inherit;border-radius:.4cqw;padding:0 .2cqw}
.pt0{background:#DCEAE0}.pt1{background:#F3E3C4}.pt2{background:#F6DCD5}.pt3{background:#DDE5F0}.pt4{background:#E8DFF0}
.ptx{border:.15cqw solid}
.prompt{background:var(--i);border:.12cqw solid var(--line);border-radius:1cqw;padding:1.2cqw 1.5cqw;font-size:1.45cqw;line-height:2;min-height:14cqw;box-shadow:var(--sh)}
.meter{height:1.2cqw;background:var(--i);border:.12cqw solid var(--line);border-radius:1cqw;overflow:hidden}
.meter b{display:block;height:100%;background:linear-gradient(to left,var(--a),var(--g))}
.cons{list-style:none;display:grid;gap:.5cqw}
.cons li{font-size:1.35cqw;display:flex;gap:.7cqw;align-items:flex-start}

/* ===== الفرز ===== */
.bins{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw;flex:1;min-height:0}
.bin{border:.18cqw dashed var(--line2);border-radius:1.1cqw;padding:1cqw;display:flex;flex-direction:column;gap:.7cqw;background:rgba(255,252,246,.45)}
.bin h5{font-size:1.5cqw;font-weight:900;color:var(--g);display:flex;justify-content:space-between}
.chipq{background:var(--i);border:.15cqw solid var(--line);border-radius:.8cqw;padding:.6cqw 1cqw;font-size:1.3cqw;font-weight:700;display:flex;justify-content:space-between;gap:.8cqw;align-items:center;box-shadow:var(--sh)}
.chipq .ch{display:flex;gap:.4cqw;flex:none}
.chipq .ch button{font-size:1.1cqw;font-weight:800;border-radius:2cqw;padding:.1cqw .9cqw;border:.13cqw solid var(--g);background:var(--i);color:var(--g)}
.chipq.right{border-color:var(--ok)}.chipq.wrong{border-color:var(--bad)}
.chipq small{display:block;font-size:1.1cqw;font-weight:500;margin-top:.2cqw}

/* ===== المنزلق ===== */
.slider{width:100%;accent-color:var(--g);height:2cqw}
.qbox{background:var(--i);border:.15cqw solid var(--line);border-radius:1.2cqw;padding:1.6cqw 2cqw;font-size:2.2cqw;font-weight:900;color:var(--g);line-height:1.5;min-height:12cqw;display:flex;align-items:center;box-shadow:var(--sh)}
.dimrow{display:flex;gap:.6cqw;flex-wrap:wrap}

/* ===== بطاقة القرار ===== */
.dcard{background:var(--i);border:.15cqw solid var(--line);border-radius:1.2cqw;overflow:hidden;box-shadow:var(--sh)}
.dcard .dr{display:grid;grid-template-columns:12cqw 1fr;border-bottom:.12cqw solid var(--line)}
.dcard .dr:last-child{border-bottom:0}
.dcard .dr b{background:var(--g);color:var(--i);padding:.8cqw 1.1cqw;font-size:1.35cqw;font-weight:900;display:flex;align-items:center;gap:.5cqw}
.dcard .dr span{padding:.8cqw 1.2cqw;font-size:1.4cqw;line-height:1.5}
.dcard .dr.lose b{background:var(--bad)}.dcard .dr.tell b{background:var(--a);color:#1E1608}

/* ===== مربّع الإذن ===== */
.vsc{direction:ltr;text-align:left;background:#1e1e1e;color:#d4d4d4;border-radius:1cqw;overflow:hidden;font-family:'Segoe UI',Tahoma,sans-serif;box-shadow:0 1cqw 3cqw rgba(0,0,0,.25)}
.vsc .tt{background:#323233;padding:.5cqw 1cqw;font-size:1.05cqw;display:flex;gap:.6cqw;align-items:center}
.vsc .tt i{width:.9cqw;height:.9cqw;border-radius:50%;display:inline-block}
.vsc .cd{padding:1cqw 1.4cqw;font-family:Consolas,monospace;font-size:1.25cqw;line-height:1.75}
.vsc .ad{background:rgba(52,211,153,.12);color:#9be5c4;display:block;border-radius:.2cqw}
.vsc .ad.badl{background:rgba(251,113,133,.2);color:#ffb3c0}
.vsc .ask{border-top:1px solid #3a3a3a;padding:.9cqw 1.4cqw;display:flex;gap:.7cqw;align-items:center;font-size:1.2cqw;flex-wrap:wrap}
.vsc .ask b{color:#fff}
.vsc .ask button{border:0;border-radius:.3cqw;padding:.35cqw 1cqw;font-size:1.15cqw;font-weight:700;color:#fff;background:#0e639c}
.vsc .ask button.n{background:#3a3d41}.vsc .ask button.f{background:#8a6a2c}

/* ===== شجرة المحاور ===== */
.tree{display:flex;flex-direction:column;align-items:center;gap:1.4cqw}
.tnode{background:var(--g);color:var(--i);border-radius:1cqw;padding:.8cqw 1.6cqw;font-weight:900;font-size:1.55cqw;text-align:center;box-shadow:var(--sh)}
.tkids{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw;width:100%}
.tax{background:var(--i);border:.15cqw solid var(--g);border-radius:1cqw;padding:.8cqw 1cqw;text-align:center;font-weight:900;color:var(--g);font-size:1.45cqw}
.thyp{margin-top:.6cqw;background:#FBF3E3;border:.13cqw dashed var(--a);border-radius:.8cqw;padding:.6cqw .9cqw;font-size:1.22cqw;font-weight:600;color:var(--t);text-align:right}
.thyp b{color:var(--a2);display:block;font-size:1.05cqw}

/* ===== ختم الحكم ===== */
.stmt{background:var(--i);border:.15cqw solid var(--line);border-radius:1cqw;padding:1cqw 1.4cqw;display:grid;grid-template-columns:1fr auto;gap:1cqw;align-items:center;position:relative;box-shadow:var(--sh)}
.stmt .t{font-size:1.5cqw;font-weight:800;color:var(--g)}
.stamp{font-size:1.3cqw;font-weight:900;border:.2cqw solid;border-radius:.5cqw;padding:.1cqw .8cqw;transform:rotate(-6deg)}
.stmt .why{grid-column:1/-1;font-size:1.25cqw}

/* ===== المحكّم ===== */
.seg3{display:grid;grid-template-columns:repeat(3,1fr);border:.13cqw solid var(--g);border-radius:.6cqw;overflow:hidden}
.seg3 button{border:0;background:var(--i);font-size:1.1cqw;font-weight:800;padding:.3cqw;color:var(--g)}
.seg3 button.on{background:var(--g);color:var(--i)}
.rub{display:grid;grid-template-columns:12cqw 1fr;gap:.6cqw 1cqw;align-items:center}
.rub b{font-size:1.3cqw;color:var(--g)}
.score{font-size:4.4cqw;font-weight:900;color:var(--a2);direction:ltr;line-height:1}
.mfile{background:var(--i);border:.12cqw solid var(--line);border-radius:1cqw;overflow:hidden;box-shadow:var(--sh)}
.mfile .fh{background:#EFE3CC;padding:.5cqw 1.2cqw;font-size:1.2cqw;font-weight:800;display:flex;justify-content:space-between}
.mfile .fb{padding:1cqw 1.4cqw;font-size:1.3cqw;line-height:1.7;white-space:pre-wrap}
.mfile .fb .h{font-weight:900;color:var(--g)}

/* ===== المهمة ===== */
.task{display:grid;grid-template-columns:repeat(4,1fr);gap:1.3cqw}
.task>div{background:var(--i);border-radius:.9cqw;border-top:.45cqw solid var(--g);padding:.8cqw 1cqw;box-shadow:var(--sh)}
.task h6{font-size:1.3cqw;font-weight:900;color:var(--a2);margin-bottom:.3cqw}
.task p,.task li{font-size:1.32cqw;line-height:1.45}
.task ul{list-style:none;display:grid;gap:.3cqw}.task li::before{content:"• ";color:var(--a)}
.pp{position:absolute;inset:auto 3cqw 3cqw 3cqw;max-height:70%;background:#fff;border:.2cqw solid var(--g);border-radius:1cqw;box-shadow:0 1cqw 3cqw rgba(0,0,0,.2);padding:1.4cqw 1.8cqw;display:flex;flex-direction:column;gap:.8cqw;z-index:5}
.pp .ph{display:flex;justify-content:space-between;align-items:center}.pp .ph b{font-size:1.5cqw;color:var(--g)}
.pp pre{white-space:pre-wrap;font-family:var(--font);font-size:1.35cqw;line-height:1.7;background:var(--b);border-radius:.6cqw;padding:1cqw 1.2cqw;overflow:auto}

/* ===== طريق المحطات ===== */
.road{width:100%;height:auto}
.road text{font-family:var(--font);text-anchor:middle}

/* ===== اللوحات ===== */
.panel{position:fixed;inset:0;background:rgba(15,30,24,.45);z-index:50}
.panel .pin{position:absolute;top:0;bottom:0;right:0;width:min(34rem,94vw);background:var(--i);overflow:auto;padding:1.2rem 1.4rem 3rem;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.panel.wide .pin{width:min(60rem,96vw)}
.panel h3{color:var(--g);font-size:1.35rem;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.6rem}
.panel h4{color:var(--a2);font-size:.95rem;font-weight:900;margin:1rem 0 .3rem}
.xb{border:1px solid var(--line2);background:var(--i);border-radius:.5rem;padding:.2rem .7rem;font-weight:800;color:var(--g)}
.idx button{display:flex;gap:.6rem;width:100%;text-align:right;border:0;background:none;padding:.3rem .4rem;border-radius:.4rem;font-size:.95rem}
.idx button:hover{background:var(--b)}.idx button.on{background:var(--tint);color:var(--g);font-weight:800}
.idx button span{direction:ltr;color:#5C5240;min-width:1.8rem;font-weight:700}
.wsi{border-top:2px solid var(--g);padding-top:.8rem;margin-top:1.2rem}
.wsi h5{font-size:1.1rem;font-weight:900;color:var(--g)}
.wsi label{display:block;margin-top:.5rem;font-weight:800;font-size:.92rem}
.wsi textarea,.wsi input{width:100%;border:1px solid var(--line2);background:#fff;border-radius:.5rem;padding:.5rem .7rem;margin-top:.2rem;resize:vertical;line-height:1.7}
.pb{border:2px solid var(--g);background:var(--g);color:var(--i);border-radius:.5rem;padding:.3rem .9rem;font-weight:800}.pb.gh{background:var(--i);color:var(--g)}
.segp{display:flex;border:1px solid var(--line2);border-radius:.5rem;overflow:hidden}.segp button{flex:1;border:0;background:var(--i);padding:.35rem;font-weight:700}.segp button.on{background:var(--g);color:var(--i)}
.small{font-size:.85rem;color:#4F4636;margin-top:.5rem}
.toast{position:fixed;bottom:4rem;left:50%;transform:translateX(-50%);background:var(--g);color:var(--i);padding:.4rem 1rem;border-radius:.5rem;font-weight:800;z-index:60}

/* ===== تقليل الحركة والطباعة ===== */
html.rm .glow,html.rm .cv .flow,html.rm .cv .halo,html.rm .cv .bob,html.rm .divider .rings{animation:none}
html.rm .cv .halo{opacity:0}
@media (prefers-reduced-motion:reduce){.glow,.cv .flow,.cv .halo,.cv .bob,.divider .rings{animation:none}.cv .halo{opacity:0}}
.print{display:none}
@media print{
 @page{size:A4 landscape;margin:8mm}
 html,body,#root{height:auto;overflow:visible;background:#fff}
 .app{display:none}.print{display:block}
 .print .ps{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;break-after:page;overflow:hidden;border:1px solid var(--line)}
 *{animation:none!important;transition:none!important}
}

/* ================= اليوم الثاني ================= */
/* مسح ضوئي فوق المخطط */
.scan{position:absolute;left:8%;right:8%;height:5cqw;top:10%;background:linear-gradient(to bottom,transparent,rgba(232,196,138,.22),transparent);animation:scan 4.8s ease-in-out infinite;pointer-events:none;border-radius:1cqw}
@keyframes scan{0%{top:6%;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:84%;opacity:0}}
html.rm .scan{display:none}@media (prefers-reduced-motion:reduce){.scan{display:none}}
.bp text{font-family:var(--font);text-anchor:middle;font-weight:800}
/* المسارات */
.lanes{display:grid;gap:1.4cqw}
.lane{background:var(--i);border:.12cqw solid var(--line);border-radius:1.1cqw;padding:1cqw 1.4cqw;box-shadow:var(--sh)}
.lane h5{font-size:1.5cqw;font-weight:900;color:var(--g);display:flex;justify-content:space-between;align-items:center;margin-bottom:.6cqw}
.track2{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:.8cqw}
.track2::before{content:"";position:absolute;right:0;left:0;top:1.3cqw;height:.25cqw;background:var(--line2);border-radius:1cqw}
.ev{position:relative;display:flex;flex-direction:column;gap:.4cqw;align-items:flex-start}
.ev .dot{width:2.6cqw;height:2.6cqw;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.2cqw;background:var(--b);border:.18cqw dashed var(--line2);color:transparent;z-index:1}
.ev.on .dot{background:var(--g);border:.18cqw solid var(--g);color:var(--i)}
.ev.bad .dot{background:var(--bad);border-color:var(--bad)}
.ev.ok .dot{background:var(--ok);border-color:var(--ok)}
.ev p{font-size:1.25cqw;line-height:1.45}
/* طبقات الخطة */
.stack{position:relative;height:25cqw}
.layer{position:absolute;width:52cqw;height:8.4cqw;border-radius:1.2cqw;display:flex;align-items:center;gap:1.4cqw;padding:0 1.8cqw;box-shadow:0 .6cqw 1.6cqw rgba(32,59,46,.14);border:.15cqw solid rgba(255,252,246,.4)}
.layer b{font-size:3cqw;font-weight:900;color:var(--gold);direction:ltr;min-width:4cqw}
.layer h4{font-size:1.8cqw;color:var(--i);font-weight:900}.layer p{font-size:1.3cqw;color:#EADFC8}
/* الرسم الخطي */
.chart{width:100%;height:auto}
.chart text{font-family:var(--font);font-size:12px;fill:#5C5240;text-anchor:middle}
/* الميزان */
.scale text{font-family:var(--font);text-anchor:middle;font-weight:800}
/* الدوائر المتقاطعة */
.venn text{font-family:var(--font);text-anchor:middle}
/* الحشد */
.crowd{display:grid;grid-template-columns:repeat(10,1fr);gap:.55cqw;direction:ltr}
.crowd span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:1.2cqw;border:.15cqw solid var(--g)}
.crowd span.out{border-style:dashed;border-color:var(--line2);background:transparent!important;color:transparent}
/* الحجب */
.post{background:var(--i);border:.12cqw solid var(--line);border-radius:1.1cqw;padding:1.4cqw 1.6cqw;font-size:1.65cqw;line-height:2;box-shadow:var(--sh)}
.post .who{display:flex;align-items:center;gap:.8cqw;font-weight:900;color:var(--g);margin-bottom:.4cqw;font-size:1.4cqw}
.post .av{width:3cqw;height:3cqw;border-radius:50%;background:var(--tint);display:grid;place-items:center}
.red{position:relative;display:inline-block;border-radius:.3cqw;padding:0 .2cqw}
.red .bar{position:absolute;inset:.25cqw 0;background:#203B2E;border-radius:.3cqw;transform-origin:right}
.keep{background:#FBF0D9;border-radius:.3cqw;padding:0 .2cqw}
/* الحلقة */
.ring text{font-family:var(--font);text-anchor:middle;font-weight:900}
/* رفّ المناهج */
.shelf{display:flex;gap:1cqw;align-items:stretch;height:24cqw}
.spine{border:0;border-radius:.8cqw;color:var(--i);padding:1cqw .6cqw;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;font-weight:900;font-size:1.35cqw;line-height:1.35;box-shadow:inset -.4cqw 0 0 rgba(0,0,0,.12),var(--sh)}
.spine i{font-style:normal;font-size:2.2cqw}
.bookopen{background:var(--i);border:.12cqw solid var(--line);border-radius:1cqw;padding:1.3cqw 1.6cqw;box-shadow:var(--sh);display:flex;flex-direction:column;gap:.6cqw;overflow:hidden}
.bookopen h4{font-size:1.8cqw;color:var(--g);font-weight:900}
.bookopen dl{display:grid;grid-template-columns:7cqw 1fr;gap:.5cqw 1cqw;font-size:1.32cqw;line-height:1.5}
.bookopen dt{font-weight:900;color:var(--a2)}
/* المطابقة */
.match{display:grid;grid-template-columns:1fr 6cqw 1fr;gap:1cqw;align-items:center}
.mq{display:grid;gap:.7cqw}
.mq button{border:.15cqw solid var(--line);background:var(--i);border-radius:.8cqw;padding:.7cqw 1cqw;text-align:right;font-size:1.3cqw;font-weight:700;box-shadow:var(--sh)}
.mq button.on{border-color:var(--g);background:var(--g);color:var(--i)}
.mm{display:grid;gap:.7cqw}
.mm div{border:.15cqw dashed var(--line2);border-radius:.8cqw;padding:.7cqw 1cqw;font-size:1.35cqw;font-weight:800;color:var(--g);background:rgba(255,252,246,.5)}
.mm div.on{border-style:solid;border-color:var(--a);background:#FBF0D9}

/* ================= التحليل ================= */
.fall{animation:fall 3.6s ease-in infinite}
@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateY(120px);opacity:0}}
html.rm .fall{animation:none}@media (prefers-reduced-motion:reduce){.fall{animation:none}}
.dtab{width:100%;border-collapse:collapse;font-size:1.25cqw;background:var(--i);border-radius:.8cqw;overflow:hidden;box-shadow:var(--sh)}
.dtab th{background:var(--g);color:var(--i);padding:.4cqw .8cqw;text-align:right}
.dtab td{padding:.35cqw .8cqw;border-bottom:.1cqw solid var(--line)}
.dtab tr.hit td{background:#F8E2DC}.dtab tr.flag td{background:#FBF0D9}.dtab tr.gone td{text-decoration:line-through;color:#9C9282}
.note2{position:absolute;width:12cqw;padding:.6cqw .8cqw;font-size:1.2cqw;font-weight:800;border-radius:.4cqw;box-shadow:0 .3cqw .8cqw rgba(32,59,46,.15)}
.board2{position:relative;height:26cqw}
.gauge{position:relative;width:5cqw;height:24cqw;border-radius:3cqw;overflow:hidden;border:.2cqw solid var(--g);background:var(--i)}
.gauge i{position:absolute;left:0;right:0}

/* ================= التقرير ================= */
.orbit{animation:orbit 18s linear infinite;transform-origin:310px 270px}
@keyframes orbit{to{transform:rotate(360deg)}}
html.rm .orbit{animation:none}@media (prefers-reduced-motion:reduce){.orbit{animation:none}}
.phone{width:12cqw;aspect-ratio:9/16;border-radius:1.6cqw;border:.5cqw solid #203B2E;background:var(--g);color:var(--i);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:1cqw;gap:.5cqw;box-shadow:0 1cqw 2.4cqw rgba(32,59,46,.25);position:relative;overflow:hidden}
.phone b{font-size:2.6cqw;line-height:1.1}.phone span{font-size:1.05cqw;line-height:1.4}
.phone .cap{position:absolute;bottom:.6cqw;left:.6cqw;right:.6cqw;background:rgba(0,0,0,.45);border-radius:.4cqw;font-size:.85cqw;padding:.2cqw .4cqw}
.pyr{display:flex;flex-direction:column;align-items:center;gap:.5cqw}
.pyr button{border:0;color:var(--i);font-weight:900;font-size:1.4cqw;padding:.8cqw 1cqw;clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);transition:filter .2s}
.wpage{background:#fff;border:.12cqw solid var(--line);border-radius:.4cqw;box-shadow:0 .6cqw 1.6cqw rgba(32,59,46,.15);padding:1.6cqw 2cqw;font-size:1.3cqw;line-height:1.7;position:relative}
.wpage h5{font-size:1.6cqw;color:var(--g);margin-bottom:.4cqw}
.wpage table{width:100%;border-collapse:collapse;font-size:1.15cqw;margin-top:.6cqw}.wpage td,.wpage th{border:.1cqw solid var(--line);padding:.2cqw .5cqw}
.ring2{position:absolute;border:.3cqw solid var(--bad);border-radius:50%;pointer-events:none}
</style></head>
